<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>短影音 場記表 · Script Supervisor's Log</title>
<meta name="description" content="三機同拍的短片拍攝場記表:排程、現場分工、Take 記錄、剪輯清單。Multi-camera shoot planner & script supervisor's log for two short videos.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light only;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 片場手機優先。上方場板條 + 黏性分頁；內容是單欄卡片，依機位分組排程、依鏡號記錄。 */
:root{
  --bg:#ffffff;--surface:#f4f6f8;--surface2:#e6eaee;--ink:#000000;--muted:#4a525a;--line:#c4cbd2;--btn:#1d5fd1;
  --acc:#f2b632;--on-acc:#14181c;
  --todo:#56606a;--ok:#1a8a50;--bak:#2563c7;--ng:#cf3434;--on-solid:#ffffff;
  --ok-soft:#dcf2e6;--bak-soft:#e0eafa;--ng-soft:#fbe3e3;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 場板條 */
.clap{height:14px;background:repeating-linear-gradient(115deg,var(--ink) 0 18px,var(--bg) 18px 36px);border-bottom:2px solid var(--ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.top{padding-block:14px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.sync{font-size:12px;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--todo)}
.sync.ok::before{background:var(--ok)}.sync.err::before{background:var(--ng)}.sync.load::before{background:var(--acc)}

/* 分頁 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tabs button b{font-size:14px;font-weight:700}
.tabs button span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tabs button[aria-selected="true"]{background:var(--btn);color:#fff;border-color:var(--btn)}
.tabs button[aria-selected="true"] span{color:inherit;opacity:.8}

main{padding-top:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:18px;margin:6px 0 0;font-weight:900}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}

.cue-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:10px}
.cue-bar button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:700;font-size:15px}
.cue-bar button[aria-pressed="true"]{color:#fff;border-color:transparent}
.cue-bar button.c1[aria-pressed="true"]{background:#1d5fd1}
.cue-bar button.c2[aria-pressed="true"]{background:#a9780a}
.cue-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:12px;scrollbar-width:none;overscroll-behavior-x:contain}
.cue-strip::-webkit-scrollbar{display:none}
.cue{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;min-height:calc(100dvh - 250px);border:3px solid var(--ink);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:#fff}
.cue.c1{border-top:14px solid #1d5fd1}.cue.c2{border-top:14px solid #d6a21a}
.cue-h{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;color:var(--muted)}
.cue-prev{font-size:clamp(16px,3.6vw,24px);color:var(--muted);background:var(--surface);border-radius:10px;padding:8px 12px}
.cue-prev b{color:var(--ink)}
.cue-t{font-size:clamp(40px,12.5vw,104px);font-weight:900;line-height:1.28;text-wrap:balance;text-align:center;margin:auto 0;letter-spacing:.02em}
.cue-t.long{font-size:clamp(34px,10vw,84px)}
.cue-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.cue-dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.cue-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.cue-dots i.on{background:var(--ink);transform:scale(1.3)}
.cue-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

.shotbar{position:sticky;top:var(--tabsH,58px);z-index:8;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px)) 4px;border-bottom:1px solid var(--line)}
.sb-row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sb-row::-webkit-scrollbar{display:none}
.sb{flex:0 0 auto;width:34px;border:2px solid transparent;border-radius:7px;background:var(--surface);padding:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.sb b{font-family:var(--mono);font-size:13px;line-height:24px;color:#fff;background:var(--todo)}
.sb.st-ok b{background:var(--ok)}.sb.st-bak b{background:var(--bak)}.sb.st-ng b{background:var(--ng)}
.sb u{text-decoration:none;font-size:10px;line-height:14px;font-weight:700;color:var(--ink);border-top:3px solid var(--muted);background:var(--surface)}
.sb.w-a u,.sb.w-y u{border-top-color:#1d5fd1}.sb.w-d u{border-top-color:#d6a21a}.sb.w-s u,.sb.w-g u{border-top-color:var(--muted)}
.sb.inrun{border-color:var(--ink)}
.sb.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--ink)}
.sb-now{font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-file{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-top:4px}.sb-file label{font-size:13px;font-weight:700}.sb-file input{min-width:0;border:2px solid var(--ink);border-radius:8px;padding:6px 8px;font-size:16px;background:#fff;font-family:var(--mono)}.sb-file .btn{padding:6px 12px}

.btn:active,.sb:active,.cue-bar button:active{transform:scale(.93);filter:brightness(.85)}
.btn,.sb{transition:transform .08s,filter .08s}
.sb{width:40px}
.sb b{line-height:30px;font-size:15px;background:var(--todo)}
.sb.fc-1 b,.sb.fc-2 b{background:#9fdcb8;color:#0b3d22}
.sb.fc-3 b{background:var(--ok);color:#fff}
.sb.ng b{background:var(--ng);color:#fff}
.camfiles{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.cf-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.cf{display:flex;flex-direction:column;gap:2px;min-width:0}
.cf span{font-size:12px;font-weight:700;color:var(--muted)}
.cf input{min-width:0;width:100%;border:2px solid var(--line);border-radius:8px;padding:8px 6px;font-size:16px;background:#fff;font-family:var(--mono)}
.cf input[readonly]{background:#e3f6ea;border-color:#9fdcb8;color:#0b3d22;font-weight:700}
.cf-btns{display:flex;gap:6px}
.cf-btns .btn{padding:8px 14px;font-size:14px}
.cf-btns .cfsave.part{background:#9fdcb8;border-color:#9fdcb8;color:#0b3d22}
.cf-btns .cfsave.full{background:var(--ok);border-color:var(--ok);color:#fff}
.camfiles.just{animation:pop .5s}
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(26,138,80,.7)}100%{box-shadow:0 0 0 14px rgba(26,138,80,0)}}
.task.flash{outline:4px solid var(--acc);outline-offset:2px;border-radius:8px}
.note{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px}

/* 設定列 */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.settings input,.settings select,.fields input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}

/* 進度 */
.prog{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .bak{background:var(--bak)}.bar .ng{background:var(--ng)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.lgd b{color:var(--ink);font-family:var(--mono)}

/* 排程時間軸 */
.tl{display:flex;flex-direction:column;gap:10px}
.tl-item{display:grid;grid-template-columns:62px 1fr;gap:12px;min-width:0}
.tl-time{font-family:var(--mono);font-size:13px;font-weight:700;padding-top:12px;line-height:1.3}
.tl-time small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.tl-body{min-width:0}
.tl-plain{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl-vid{font-weight:900;font-size:16px;padding-top:8px;border-top:3px solid var(--ink)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.block .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.block .bh b{font-size:15px}
.block .bh span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-weight:700;font-size:13px;min-width:38px;padding:5px 8px;border-radius:7px;border:0;background:var(--todo);color:var(--on-solid)}
.chip.st-ok{background:var(--ok)}.chip.st-bak{background:var(--bak)}.chip.st-ng{background:var(--ng)}

/* 場記卡 */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.shead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.no{font-family:var(--mono);font-weight:700;font-size:20px;min-width:50px;text-align:center;padding:8px 6px;border-radius:8px;background:var(--todo);color:var(--on-solid)}
.st-ok .no{background:var(--ok)}.st-bak .no{background:var(--bak)}.st-ng .no{background:var(--ng)}
.shead .meta{min-width:0}
.shead .meta b{display:block;font-size:16px;line-height:1.3}
.shead .meta span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.btn{border:1px solid var(--btn);background:var(--btn);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:var(--btn);border-color:var(--btn)}
.btn.acc{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.dialog{font-size:15px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.tag.warn{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 22%,transparent)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 13px;font-weight:700;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{color:var(--on-solid)}
.seg button[data-v="todo"][aria-pressed="true"]{background:var(--todo)}
.seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok)}
.seg button[data-v="bak"][aria-pressed="true"]{background:var(--bak)}
.seg button[data-v="ng"][aria-pressed="true"]{background:var(--ng)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step button{border:0;background:var(--bg);width:40px;height:38px;font-size:20px;font-weight:700}
.step output{min-width:78px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fields .wide{grid-column:1/-1}
.ex{display:flex;flex-direction:column;gap:4px}
.ex label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.ex input{margin-top:4px;width:18px;height:18px;accent-color:var(--acc);flex:none}
details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;padding:2px 0}
dl.info{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;margin:8px 0 0;font-size:13px}
dl.info dt{color:var(--muted);font-weight:700}
dl.info dd{margin:0;min-width:0}
.empty{color:var(--muted);text-align:center;padding:24px 0}

/* 剪輯頁 */
.strip{display:flex;gap:2px;height:44px}
.strip i{display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--todo);color:var(--on-solid);border-radius:3px;min-width:3px;overflow:hidden}
.strip i.st-ok{background:var(--ok)}.strip i.st-bak{background:var(--bak)}.strip i.st-ng{background:var(--ng)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td.n{font-family:var(--mono);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--todo);color:var(--on-solid)}
.pill.ok{background:var(--ok)}.pill.bak{background:var(--bak)}.pill.ng{background:var(--ng)}
textarea.out{width:100%;min-height:140px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}

/* 場板（拍攝時大字） */
.slate{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 72%,transparent);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.slate-card{width:100%;max-width:520px;background:var(--surface);border:3px solid var(--ink);border-radius:10px;overflow:hidden;margin-block:auto}
.slate-card .clap{margin:0;height:34px;border-bottom:3px solid var(--ink)}
.slate-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sgrid div{border:2px solid var(--ink);border-radius:8px;padding:6px 10px;min-width:0}
.sgrid span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sgrid b{font-family:var(--mono);font-size:44px;line-height:1.1;font-weight:700}
.sgrid .cam b{font-size:34px}
.sact{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sact button{padding:14px 8px;font-size:17px;font-weight:900;border-radius:10px;border:0;color:var(--on-solid)}
.sact .a-ok{background:var(--ok)}.sact .a-bak{background:var(--bak)}.sact .a-ng{background:var(--ng)}.sact .a-n{background:var(--todo)}
.snav{display:flex;justify-content:space-between;gap:8px}
.chip.sm{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;padding:4px 6px;min-width:0;font-size:13px}
.chip small{font-size:10px;font-weight:500;opacity:.9}
.runs{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.rh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;font-family:var(--mono)}
.rlab{font-family:var(--mono);font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--acc);color:var(--on-acc);border-radius:7px;padding:5px 0}
.cell{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.cell .chip{width:100%}
.cell .tag{text-align:center}
.rnote{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.chip.sel{background:var(--surface2);color:var(--ink);border:2px solid var(--line);padding:7px 10px}
.chip.sel[aria-pressed="true"]{background:var(--btn);color:#fff;border-color:var(--btn)}
.vsw{display:flex;width:100%}
.vsw button{flex:1;min-width:0}
.vsw button[aria-pressed="true"]{background:var(--btn);color:#fff}
.runbar{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.runbar select{min-width:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}
.runbar .btn{padding:9px 6px}
.runbar.top2{grid-template-columns:1fr 1fr}.runbar.top2 select{grid-column:1/-1}.runbar.top2 .btn{padding:12px 6px;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
.runhead{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.rl{font-family:var(--mono);font-weight:700;font-size:30px;background:var(--acc);color:var(--on-acc);border:2px solid var(--ink);border-radius:8px;padding:4px 12px;flex:none}
.camcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.camcard h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:18px;font-weight:900}
.task{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.thead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.no.sm{font-size:16px;min-width:42px;padding:6px 4px}
.hint{margin:0;font-size:13px;background:var(--surface2);border-radius:6px;padding:6px 9px}
.warnline{margin:0;font-size:13px;border:1px dashed var(--acc);border-radius:6px;padding:6px 9px}
.idle{margin:0;color:var(--muted);font-size:14px}
.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps.plain{padding-left:0;list-style:none}
.takebig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.takebig b{font-family:var(--mono);font-size:34px;line-height:1}

let db=null;const timers={},pend={},chain={},failed=new Set();

function setSync(c,t){const e=$('#sync');e.className='sync '+c;e.textContent=t}
function persist(k){
  saveLocal();
  if(!db)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    delete timers[k];pend[k]=(pend[k]||0)+1;
    const body=JSON.parse(JSON.stringify(k==='meta'?S.meta:S.logs[k]));
    const ref=k==='meta'?db.doc('meta/plan'):db.doc('logs/'+k);
    chain[k]=(chain[k]||Promise.resolve()).then(()=>ref.set(body)).then(()=>{failed.delete(k);setSync('ok','已同步')},()=>{failed.add(k);setSync('err','同步失敗，已存在此裝置，會自動重試')}).then(()=>{pend[k]--});
  },500);
}

function fmtT(m){m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
const beatMin=(b,sp)=>Math.round((b.chg+b.runs.reduce((a,x)=>a+x.min,0))*sp);
function build(){
  /* 照正式「拍攝流程表」：時間是固定的，每個視窗裡的組按原估分鐘數等比例分配 */
  const [h,m]=S.meta.call.split(':').map(Number);let t=(h||0)*60+(m||0);
  const items=[];
  const push=(o,d)=>{o.start=t;t+=d;o.end=t;items.push(o)};
  const win=(v,part,total,ids,desc)=>{
    const bs=BEATS[v].filter(b=>ids.includes(b.id));
    const est=bs.reduce((a,b)=>a+beatMin(b,1),0);
    items.push({kind:'vid',v,start:t,part});
    if(desc)items.push({kind:'note',text:desc+'　共 '+total+' 分鐘，原本估要 '+est+' 分鐘'+(est>total?'，時間很緊，要抓重點、少 take。':'。')});
    let left=total;
    bs.forEach((b,i)=>{const o=beatMin(b,1);const d=i===bs.length-1?left:Math.round(o*total/est);left-=d;push({kind:'beat',v,b,orig:o},d)});
  };
  push({kind:'plain',title:'劇組進場 · 場佈',desc:'檢查攝影及燈光設備、確認場景與道具'},60);
  push({kind:'plain',title:'藝人妝髮 · 拍前準備',desc:'舞棍阿北到場、妝髮梳化及更換亮片裝；源寶偶裝配件測試。確認造型、源寶活動性與演出安全'},40);
  push({kind:'plain',title:'PART 1　主視覺平面形象照',desc:'阿北拿梳子與源寶招牌合照、趣味互動、雙人與單人素材。可同步進行動作指導與走位排練。流程：先拍阿伯（藍衣）平面 → 換源寶平面，阿伯同時拍短影音 1 單人鏡頭（見下方「演員輪流拍法」）'},95);
  push({kind:'plain',title:'中場休息'},15);
  win('v1','PART 2　短影音 1',90,BEATS.v1.map(b=>b.id),'源寶平面拍完後，兩人一起拍短影音 1 剩下的部分，依腳本及分鏡執行。阿伯單人鏡頭若已在 PART 1 拍掉，這段會寬鬆很多。');
  push({kind:'plain',title:'換場 · 道具確認',desc:'確認道具、場景與鏡位'},15);
  win('v2','PART 3　短影音 2 前半段',45,['A','B'],'');
  push({kind:'plain',title:'晚餐 · 休息',desc:'晚間放飯，藝人休息室用餐與補妝。劇組同步備份檔案'},40);
  win('v2','PART 4　短影音 2 補拍',90,['C','D'],'短影音 2 後半段與特寫補拍；結尾段落、阿北（阿伯）單人特寫、安全空鏡。');
  push({kind:'plain',title:'最終確認 · 殺青',desc:'核對素材與現場收尾；確認必要畫面、備份及補拍清單'},20);
  return items;
}

function recordRun(v,rn,ns,r){
  const t=runTake(v,rn);
  ns.forEach(n=>{

    if(r==='ok'){p.st='ok';p.ok=String(t)}

    else if(r==='ng'){p.st='ng'}

    patch(k,p);
  });

const camLabel=t=>t.replace(/Cam([123])(?!／)(（[^）]*）)?/g,(m,c)=>{const n=((S.meta.cams||{})[c]||'').replace(/[（）]/g,'');return 'Cam'+c+(n?'（'+n+'）':'')});
let camObs=null;
function applyCams(){
  if(camObs)camObs.disconnect();
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const p=n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE'||p==='TITLE')continue;const t=camLabel(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}
  if(camObs)camObs.observe(document.body,{childList:true,subtree:true});
}
camObs=new MutationObserver(()=>applyCams());

    const k=b.dataset.k,l=L(k),d=new Date();

  else if(a==='lrec'){const v=UI.lv,rn=RUNS[v][curRun(v)];recordRun(v,rn,runShots(rn).filter(isSel),b.dataset.r);render()}
  else if(a==='slsel'){SL.sel[b.dataset.n]=!SL.sel[b.dataset.n];renderSlate()}
  else if(a==='sl')slateRecord(b.dataset.r);
  else if(a==='slnav')slateNav(+b.dataset.d);
  else if(a==='slclose'){SL=null;renderSlate();render()}
  else if(a==='fsu'){F[b.dataset.v].su=b.dataset.id;render()}
  else if(a==='fwho'){F[b.dataset.v].who=b.dataset.id;render()}
  else if(a==='fst'){F[b.dataset.v].st=b.dataset.id;render()}
  else if(a==='copy'){
    const v=b.dataset.v,ta=$('#out-'+v),text=exportText(v);
    ta.value=text;ta.hidden=false;
    const done=()=>{b.textContent='已複製'};
    try{navigator.clipboard.writeText(text).then(done,()=>{ta.focus();ta.select()})}catch(err){ta.focus();ta.select()}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='ex'){const k=t.dataset.k,l=L(k),ex=Object.assign({},l.ex);if(t.checked)ex[t.dataset.i]=true;else delete ex[t.dataset.i];patch(k,{ex});}
  else if(a==='lsel'){const k=selKey();LSEL[k]=Object.assign({},LSEL[k]);LSEL[k][t.dataset.n]=t.checked}
  else if(t.id==='f-run'){UI.cur[UI.lv]=+t.value;saveUI();render()}
  else if(a==='prep'){const p=Object.assign({},S.meta.prep);if(t.checked)p[t.dataset.id]=true;else delete p[t.dataset.id];patchMeta({prep:p})}
  else if(t.id==='f-date'&&t.value){patchMeta({date:t.value});render()}
  else if(t.id==='f-call'&&t.value){patchMeta({call:t.value});render()}
  else if(t.id==='f-speed'){patchMeta({speed:+t.value});render()}
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.dataset&&t.dataset.cam){patchMeta({cams:Object.assign({1:'',2:'',3:''},S.meta.cams,{[t.dataset.cam]:t.value.trim()})});applyCams();return}
 if(t.dataset&&t.dataset.f){patch(t.dataset.k,{[t.dataset.f]:t.value})}
});
document.addEventListener('focusout',()=>{if(dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},60)});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(ZM){ZM=null;renderZoom()}else if(SL){SL=null;renderSlate();render()}});
$('#app').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.d){d.open?openSet.add(d.dataset.d):openSet.delete(d.dataset.d)}},true);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==tab)setTab(h)});

/* ============ 同步：自家伺服器版（輪詢，介面比照 db） ============ */
function makeHttpDb(base){
  let since=0,stop=false;const docs={},myU={},colCbs=[],docCbs=[];
  const emit=()=>{
    const logs=Object.keys(docs).filter(k=>k.startsWith('logs/')).map(k=>({id:k.slice(5),data:()=>docs[k]}));
    colCbs.forEach(f=>f({metadata:{fromCache:false},docs:logs}));
    docCbs.forEach(f=>f({exists:!!docs['meta/plan'],data:()=>docs['meta/plan']}));
  };
  async function tick(){
    try{
      const r=await fetch(base+'/state?since='+since,{credentials:'same-origin',cache:'no-store'});
      if(r.status===401){location.reload();return}
      const j=await r.json();let ch=since===0;
      (j.docs||[]).forEach(d=>{if(myU[d.k]&&d.u<=myU[d.k])return;docs[d.k]=d.v;ch=true});
      since=Math.max(since,j.seq||0);
      if(ch)emit();
      failed.forEach(k=>persist(k));
    }catch(e){setSync('err','連不上伺服器，先存在此裝置')}
  }
  const loop=async()=>{while(!stop){await tick();await new Promise(r=>setTimeout(r,document.hidden?6000:2000))}};
  setTimeout(loop,0);
  return {
    collection:()=>({onSnapshot:(f)=>{colCbs.push(f)}}),
    doc:path=>({
      set:async body=>{
        const r=await fetch(base+'/doc?k='+encodeURIComponent(path),{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
        if(!r.ok)throw new Error('http '+r.status);
        const j=await r.json();myU[path]=Math.max(myU[path]||0,j.u);
      },
      onSnapshot:f=>{docCbs.push(f)}
    })
  };
}

/* ============ 同步（db） ============ */
(async()=>{
  try{
    if(window.SLATE_SYNC){db=makeHttpDb(window.SLATE_SYNC)}
    else{const c=window.claude;if(!c||!c.use){setSync('','只存在這支手機');return}
    db=await c.use('db');}
    if(!db){setSync('','只存在這支手機');return}
    setSync('load','同步中');
    const wait=setTimeout(()=>setSync('err','連不上雲端，先存在此裝置'),10000);
    db.collection('logs').onSnapshot(snap=>{
      clearTimeout(wait);if(!snap.metadata.fromCache)setSync('ok','已同步');
      let ch=false;
      snap.docs.forEach(d=>{
        if(busy(d.id))return;
        const data=JSON.parse(JSON.stringify(d.data()||{}));
        if(JSON.stringify(data)!==JSON.stringify(S.logs[d.id])){S.logs[d.id]=data;ch=true}
      });
      if(ch){saveLocal();scheduleRender()}
    },()=>{clearTimeout(wait);setSync('err','同步中斷，已存在此裝置')});
    db.doc('meta/plan').onSnapshot(d=>{
      if(!d.exists||busy('meta'))return;
      const m=JSON.parse(JSON.stringify(d.data()||{}));
      if(JSON.stringify(Object.assign({},S.meta,m))!==JSON.stringify(S.meta)){S.meta=Object.assign(defMeta(),S.meta,m);saveLocal();scheduleRender()}
    },()=>{});
  }catch(err){setSync('','只存在這支手機')}
})();

else if(TABS.some(x=>x[0]===h0))tab=h0;
else tab=TABS.some(x=>x[0]===UI.tab)?UI.tab:'plan';
render();
applyCams();
